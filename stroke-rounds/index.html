<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1220" />
<meta name="description" content="StrokeRounds — a fast, offline, private rounding list and structured stroke note builder for the stroke attending." />
<title>StrokeRounds — Attending Rounding List</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="StrokeRounds" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ============ LOCK SCREEN ============ -->
<div id="lockScreen" class="lock-screen" hidden>
  <div class="lock-card">
    <div class="lock-logo">◈</div>
    <h1>StrokeRounds</h1>
    <p class="muted">Enter passcode to unlock this device's list.</p>
    <input id="lockInput" class="lock-input" type="password" inputmode="numeric" autocomplete="off" placeholder="••••" />
    <p id="lockError" class="lock-error" hidden>Incorrect passcode</p>
    <button id="lockBtn" class="btn btn-primary btn-block">Unlock</button>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="app" hidden>

  <!-- Header -->
  <header class="appbar">
    <button id="backBtn" class="icon-btn" title="Back" aria-label="Back" hidden>‹</button>
    <div class="appbar-title">
      <h1 id="appTitle">Census</h1>
      <span id="appSub" class="appbar-sub"></span>
    </div>
    <div class="appbar-actions">
      <button id="themeBtn" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">◐</button>
      <button id="lockNowBtn" class="icon-btn" title="Lock app" aria-label="Lock app" hidden>🔒</button>
    </div>
  </header>

  <main id="main" class="main">

    <!-- ============ CENSUS VIEW ============ -->
    <section id="view-census" class="view">
      <div class="toolbar">
        <div class="search-wrap">
          <span class="search-icon">⌕</span>
          <input id="searchInput" type="search" placeholder="Search name, room, MRN, dx…" autocomplete="off" />
        </div>
        <select id="sortSelect" class="select" aria-label="Sort list">
          <option value="room">Sort: Room</option>
          <option value="name">Sort: Name</option>
          <option value="day">Sort: Hospital day</option>
          <option value="nihss">Sort: NIHSS</option>
          <option value="updated">Sort: Recently updated</option>
        </select>
      </div>

      <div class="chip-row" id="filterChips">
        <button class="chip chip-toggle is-on" data-filter="active">Active</button>
        <button class="chip chip-toggle" data-filter="discharged">Signed off</button>
        <button class="chip chip-toggle" data-filter="notrounded">Not rounded today</button>
        <button class="chip chip-toggle" data-filter="flag">Flagged</button>
        <button class="chip chip-toggle" data-filter="tasks">Open tasks</button>
      </div>

      <div id="censusStats" class="stat-row"></div>
      <div id="censusList" class="list"></div>
      <div id="censusEmpty" class="empty" hidden>
        <div class="empty-glyph">◈</div>
        <h2>No patients yet</h2>
        <p class="muted">Add your first patient to start the list. Everything stays on this device.</p>
        <button class="btn btn-primary" data-action="new-patient">Add patient</button>
        <button class="btn btn-ghost" data-action="load-demo">Load a demo patient</button>
      </div>
    </section>

    <!-- ============ PATIENT VIEW ============ -->
    <section id="view-patient" class="view" hidden>
      <div id="patientHeader" class="patient-header"></div>
      <nav class="tabs" id="patientTabs">
        <button class="tab is-active" data-tab="round">Round</button>
        <button class="tab" data-tab="workup">Work-up</button>
        <button class="tab" data-tab="profile">Profile</button>
        <button class="tab" data-tab="history">History</button>
        <button class="tab" data-tab="note">Note</button>
      </nav>
      <div id="patientBody" class="patient-body"></div>
    </section>

    <!-- ============ TOOLS VIEW ============ -->
    <section id="view-tools" class="view" hidden>
      <div id="toolsBody"></div>
    </section>

    <!-- ============ SETTINGS VIEW ============ -->
    <section id="view-settings" class="view" hidden>
      <div id="settingsBody"></div>
    </section>

  </main>

  <!-- Floating add button -->
  <button id="fab" class="fab" title="Add patient" aria-label="Add patient">＋</button>

  <!-- Bottom navigation -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-btn is-active" data-view="census"><span class="nav-ico">☰</span><span>Census</span></button>
    <button class="nav-btn" data-view="tools"><span class="nav-ico">∑</span><span>Tools</span></button>
    <button class="nav-btn" data-view="settings"><span class="nav-ico">⚙</span><span>Settings</span></button>
  </nav>
</div>

<!-- ============ MODAL ============ -->
<div id="modal" class="modal" hidden>
  <div class="modal-backdrop" data-close="1"></div>
  <div class="modal-card" role="dialog" aria-modal="true">
    <header class="modal-head">
      <h2 id="modalTitle">Title</h2>
      <button class="icon-btn" id="modalClose" aria-label="Close">✕</button>
    </header>
    <div id="modalBody" class="modal-body"></div>
    <footer id="modalFoot" class="modal-foot"></footer>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="js/store.js"></script>
<script src="js/scores.js"></script>
<script src="js/note.js"></script>
<script src="js/app.js"></script>
</body>
</html>
